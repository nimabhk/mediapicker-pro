<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)" stroke="url(#neon)" stroke-width="8" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="160" fill="url(#lens)" stroke="url(#neon)" stroke-width="12" filter="url(#glow)" />

  <!-- Film / Media Camera Aperture blades -->
  <circle cx="256" cy="256" r="110" fill="#0f172a" stroke="#334155" stroke-width="6" />

  <!-- Play / Curate Triangle -->
  <path d="M 230 196 L 316 256 L 230 316 Z" fill="url(#neon)" />

  <!-- Star / Check spark -->
  <circle cx="360" cy="150" r="18" fill="#ffedd5" filter="url(#glow)" />
  <circle cx="360" cy="150" r="10" fill="#ff7a00" />
</svg>
